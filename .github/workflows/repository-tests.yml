name: Repository Tests

on:
  pull_request:
    paths:
      - '.github/**'
      - 'apps/**'
      - 'platform/**'
      - 'modules/**'
      - 'infrastructure/**'
      - 'localizations/**'
      - 'docs/**'
      - 'tests/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
  push:
    branches:
      - main
      - 'phase/**'
    paths:
      - '.github/**'
      - 'apps/**'
      - 'platform/**'
      - 'modules/**'
      - 'infrastructure/**'
      - 'localizations/**'
      - 'docs/**'
      - 'tests/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    name: Test ${{ matrix.area }} structure
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        area:
          - .github
          - apps
          - platform
          - modules
          - infrastructure
          - localizations
          - docs
          - tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify area documentation
        shell: bash
        run: |
          if [ ! -f "${{ matrix.area }}/README.md" ]; then
            echo "::error title=Missing area documentation::${{ matrix.area }}/README.md is missing"
            exit 1
          fi

      - name: Verify directory documentation
        shell: bash
        run: |
          missing=0

          while IFS= read -r -d '' directory; do
            if [ ! -f "$directory/README.md" ]; then
              echo "::error title=Missing directory documentation::$directory/README.md is missing"
              missing=1
            fi
          done < <(find "${{ matrix.area }}" -mindepth 1 -type d -print0)

          exit "$missing"

  brand-identity:
    name: Verify Ivadoo naming
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Reject legacy product identifiers
        shell: bash
        run: |
          set -euo pipefail

          old_title="Fashion""ERP"
          old_lower="fashion""erp"
          old_upper="FASHION""ERP"
          old_slug="Fashion""-ERP"
          old_slug_lower="${old_slug,,}"

          failed=0

          legacy_path_pattern="(^|/)(${old_lower}|${old_slug_lower})(/|$)"
          legacy_paths="$(git ls-files | grep -Ei "${legacy_path_pattern}" || true)"
          if [ -n "$legacy_paths" ]; then
            echo "::group::Legacy paths"
            printf '%s\n' "$legacy_paths"
            echo "::endgroup::"
            failed=1
          fi

          legacy_content_pattern="${old_title}|${old_lower}|${old_upper}|${old_slug}"
          legacy_content="$(git grep -nI -E "${legacy_content_pattern}" -- . || true)"
          if [ -n "$legacy_content" ]; then
            echo "::group::Legacy content"
            printf '%s\n' "$legacy_content"
            echo "::endgroup::"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "::error title=Legacy product identity detected::Tracked paths/content must use Ivadoo naming."
          fi

          exit "$failed"

  security-static:
    name: High-risk secret pattern scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan tracked files for high-risk secret formats
        shell: bash
        run: |
          set -euo pipefail

          failed=0
          git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|sk_live_[A-Za-z0-9]{16,}|xox[baprs]-[A-Za-z0-9-]{10,}' -- .             && failed=1 || true

          if [ "$failed" -ne 0 ]; then
            echo "::error title=Potential secret detected::Review the matching tracked file(s)."
          fi

          exit "$failed"
