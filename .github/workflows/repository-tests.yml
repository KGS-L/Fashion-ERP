name: Repository Tests

on:
  pull_request:
    paths:
      - '.github/**'
      - 'apps/**'
      - 'platform/**'
      - 'modules/**'
      - 'infrastructure/**'
      - 'localizations/**'
      - 'docs/**'
      - 'tests/**'
  push:
    branches:
      - main
      - 'phase/**'
    paths:
      - '.github/**'
      - 'apps/**'
      - 'platform/**'
      - 'modules/**'
      - 'infrastructure/**'
      - 'localizations/**'
      - 'docs/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    name: Test ${{ matrix.area }} structure
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        area:
          - .github
          - apps
          - platform
          - modules
          - infrastructure
          - localizations
          - docs
          - tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify area documentation
        shell: bash
        run: |
          if [ ! -f "${{ matrix.area }}/README.md" ]; then
            echo "::error title=Missing area documentation::${{ matrix.area }}/README.md is missing"
            exit 1
          fi

      - name: Verify directory documentation
        shell: bash
        run: |
          missing=0

          while IFS= read -r -d '' directory; do
            if [ ! -f "$directory/README.md" ]; then
              echo "::error title=Missing directory documentation::$directory/README.md is missing"
              missing=1
            fi
          done < <(find "${{ matrix.area }}" -mindepth 1 -type d -print0)

          exit "$missing"
