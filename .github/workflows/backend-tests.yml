name: Backend Tests

on:
  pull_request:
    paths:
      - 'platform/server/**'
      - 'docs/api/**'
      - 'docs/adr/**'
      - 'docs/migrations/**'
      - 'docs/operations/**'
      - 'docs/security/**'
      - '.github/workflows/backend-tests.yml'
  push:
    branches:
      - main
      - 'phase/**'
    paths:
      - 'platform/server/**'
      - 'docs/api/**'
      - 'docs/adr/**'
      - 'docs/migrations/**'
      - 'docs/operations/**'
      - 'docs/security/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django:
    name: Django / Python 3.14
    runs-on: ubuntu-latest

    services:
      postgres:
        # CI compatibility fixture only. The production PostgreSQL version
        # remains governed by the dedicated PostgreSQL/storage work.
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ivadoo_test
          POSTGRES_USER: ivadoo
          POSTGRES_PASSWORD: ivadoo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ivadoo -d ivadoo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: platform/server

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DJANGO_DEBUG: 'false'
      IVADOO_2FA_ENCRYPTION_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      POSTGRES_DB: ivadoo_test
      POSTGRES_USER: ivadoo
      POSTGRES_PASSWORD: ivadoo_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_TENANT_B_DB: ivadoo_tenant_b
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: platform/server/pyproject.toml

      - name: Install backend
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Static Python validation
        run: python -m compileall -q ivadoo

      - name: Django system checks
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Inspect migration plans
        run: |
          python manage.py showmigrations identity organizations authorization audit internationalization --plan
          python manage.py showmigrations inventory purchases manufacturing quality delivery operations --plan
          python manage.py migrate --plan

      - name: Create second isolated tenant database
        env:
          PGPASSWORD: ivadoo_ci
        run: |
          psql -h 127.0.0.1 -U ivadoo -d postgres \
            -c "CREATE DATABASE ivadoo_tenant_b OWNER ivadoo;"

      - name: Apply migrations on primary PostgreSQL
        run: python manage.py migrate --noinput

      - name: Apply migrations on isolated tenant PostgreSQL
        run: python manage.py migrate --database=tenant_b --noinput

      - name: Verify no unapplied migrations remain
        run: |
          python manage.py migrate --check
          python manage.py migrate --database=tenant_b --check

      - name: Validate OpenAPI schema
        run: python manage.py spectacular --file /tmp/ivadoo-openapi.yaml --validate --fail-on-warn

      - name: Run Django tests
        run: python manage.py test
