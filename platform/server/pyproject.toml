[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "fashionerp-server"
version = "0.1.0"
description = "FashionERP Django server"
requires-python = ">=3.14,<3.15"
license = "LGPL-3.0-only"
dependencies = [
    "Django==5.2.17",
    "djangorestframework==3.17.2",
    "drf-spectacular==0.30.0",
    "django-filter==26.1",
    "psycopg[binary]==3.3.4",
    "argon2-cffi==25.1.0",
    "pyotp==2.10.0",
    "cryptography==50.0.1",
    "openpyxl==3.1.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fashionerp*"]


[tool.setuptools.package-data]
"fashionerp.internationalization" = ["catalogs/*.json"]
